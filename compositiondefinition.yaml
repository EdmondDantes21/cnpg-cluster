apiVersion: core.krateo.io/v1alpha1
kind: CompositionDefinition
metadata:
  name: cnpg-cluster
  namespace: krateo-system
spec:
  chart:
    repo: cnpg-cluster
    url: oci://ghcr.io/edmonddantes21/cnpg-cluster
    version: "0.1.0"
  apiRef:
    name: cnpg-cluster-status
    namespace: krateo-system
  statusDataTemplate:
    - forPath: phase
      expression: '${ .api.cluster.items[0].status.phase // null }'
    - forPath: readyInstances
      type: integer
      expression: '${ .api.cluster.items[0].status.readyInstances // null }'
    - forPath: host
      expression: '${ .api.cluster.items[0].metadata | if . == null then null else "\(.name)-rw.\(.namespace).svc" end }'
    - forPath: appSecret
      expression: '${ .api.cluster.items[0].metadata.name | if . == null then null else "\(.)-app" end }'

    # Health: the Cluster's Ready condition. null hands the verdict back to the controller.
    - forPath: health.ready
      type: boolean
      expression: '${ .api.cluster.items[0].status.conditions | if . == null then null else any(.[]; .type == "Ready" and .status == "True") end }'
    - forPath: health.reason
      expression: Creating
    - forPath: health.message
      expression: '${ .api.cluster.items[0].status | if . == null or any(.conditions[]?; .type == "Ready" and .status == "True") then null else (.phase // "Waiting for the database") end }'
