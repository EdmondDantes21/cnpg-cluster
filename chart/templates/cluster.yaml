apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cnpg-cluster.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cnpg-cluster
    app.kubernetes.io/instance: {{ include "cnpg-cluster.name" . }}
spec:
  instances: {{ .Values.instances }}
  {{- with .Values.imageName }}
  imageName: {{ . }}
  {{- end }}
  storage:
    size: {{ .Values.storage.size }}
    {{- with .Values.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.database.name }}
      owner: {{ .Values.database.owner }}
